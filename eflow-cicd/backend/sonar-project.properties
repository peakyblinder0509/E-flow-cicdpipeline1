# ─────────────────────────────────────────
# SonarQube - Backend Project Properties
# E-Flow Node.js Microservice
# Change sonar.projectKey per service
# ─────────────────────────────────────────

sonar.projectKey=eflow-userservice
sonar.projectName=E-Flow User Service
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,**/*.test.js,**/*.spec.js,dist/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
