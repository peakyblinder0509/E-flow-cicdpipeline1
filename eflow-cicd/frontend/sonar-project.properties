# ─────────────────────────────────────────
# SonarQube - Frontend Project Properties
# E-Flow React Frontend
# ─────────────────────────────────────────

sonar.projectKey=eflow-frontend
sonar.projectName=E-Flow Frontend
sonar.projectVersion=1.0

sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,**/*.test.js,**/*.spec.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
